[package]
name = "ptywright"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["James Brink <brink.james@gmail.com>"]
description = "A cross-platform Rust CLI and library for driving interactive terminal applications through PTYs"
homepage = "https://utensils.io/ptywright/"
documentation = "https://utensils.io/ptywright/"
repository = "https://github.com/utensils/ptywright"
readme = "README.md"
keywords = ["pty", "tui", "cli", "automation", "terminal"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
# Pin `cargo run` (and the devshell `ptywright` helper that wraps it) to the
# main binary so the addition of test-only [[bin]] targets like
# `ptywright-echo-tui` doesn't break interactive workflows.
default-run = "ptywright"

[features]
default = ["repl"]
# Interactive REPL client (`ptywright repl`). Enabled by default; opt out
# with `cargo build --no-default-features` if you need the lean baseline
# build without `reedline` / `crossbeam-channel` / `nu-ansi-term`.
repl = [
    "dep:crossbeam-channel",
    "dep:nu-ansi-term",
    "dep:reedline",
]
# Internal feature gate for the test-only `ptywright-echo-tui` fixture
# binary. Not part of the public surface — exists solely so the bin
# target carries `required-features = ["_test-fixtures"]`, which keeps
# `cargo install ptywright` from installing the fixture alongside the
# real CLI. CI test invocations enable it explicitly.
_test-fixtures = []

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
dirs = "5"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize", "send"] }
portable-pty = "0.9.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
vt100 = "0.16.2"

# Optional dependencies, only pulled in by the `repl` feature.
crossbeam-channel = { version = "0.5", optional = true }
nu-ansi-term = { version = "0.50", optional = true }
reedline = { version = "0.47", optional = true, default-features = false, features = ["external_printer"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.2"

[target.'cfg(unix)'.dependencies]
# Direct dep so `serve --socket` can install SIGINT/SIGTERM handlers that
# unlink the socket file on graceful exit. libc is already in the tree
# transitively, but pinning it directly keeps the signal-handler call
# site honest under future `cargo update`s.
libc = "0.2"

[[bin]]
name = "ptywright-echo-tui"
path = "tests/fixtures/echo_tui/main.rs"
test = false
doctest = false
bench = false
# Gate this test-only fixture behind an internal feature so it is never
# built by `cargo build` / `cargo install` of a fresh checkout. The
# integration test in `tests/cli_tests.rs` resolves the binary through
# `CARGO_BIN_EXE_ptywright-echo-tui`, so CI test runs pass
# `--features _test-fixtures` to enable it. Without this gate,
# `cargo install ptywright` would deposit the fixture binary in the
# user's `~/.cargo/bin` next to the real CLI.
required-features = ["_test-fixtures"]
