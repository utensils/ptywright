name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install docs dependencies
        working-directory: website
        run: bun install
      - name: Check docs formatting
        working-directory: website
        run: bun run fmt:check
      - name: Build docs
        working-directory: website
        run: bun run build

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" check --locked
      - name: Check
        if: runner.os != 'macOS'
        run: rustup run stable cargo check --locked
      - name: Clippy
        if: runner.os != 'macOS'
        run: rustup run stable cargo clippy --locked -- -D warnings
      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" test --locked --lib --bins --tests
      - name: Test
        if: runner.os != 'macOS'
        run: rustup run stable cargo test --locked
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" build --release --locked
      - name: Build
        if: runner.os != 'macOS'
        run: rustup run stable cargo build --release --locked

      # Opt-in REPL feature: keeps the default-build matrix lean while still
      # exercising the `--features repl` path on every push. Windows is
      # check-only for v1 — the TUI integration test relies on a unix
      # `/bin/sh` fixture and is unix-gated at the source level.
      - name: Check (--features repl, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" check --locked --features repl
      - name: Check (--features repl)
        if: runner.os != 'macOS'
        run: rustup run stable cargo check --locked --features repl
      - name: Clippy (--features repl)
        if: runner.os != 'macOS'
        run: rustup run stable cargo clippy --locked --features repl --tests -- -D warnings
      - name: Test (--features repl, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" test --locked --features repl --lib --bins --tests
      - name: Test (--features repl)
        if: runner.os == 'ubuntu-latest'
        run: rustup run stable cargo test --locked --features repl

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
