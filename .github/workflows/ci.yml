name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install docs dependencies
        working-directory: website
        run: bun install
      - name: Check docs formatting
        working-directory: website
        run: bun run fmt:check
      - name: Build docs
        working-directory: website
        run: bun run build

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" check --locked
      - name: Check
        if: runner.os != 'macOS'
        run: rustup run stable cargo check --locked
      - name: Clippy
        if: runner.os != 'macOS'
        run: rustup run stable cargo clippy --locked -- -D warnings
      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" test --locked --features _test-fixtures --lib --bins --tests
      - name: Test
        if: runner.os != 'macOS'
        run: rustup run stable cargo test --locked --features _test-fixtures

      # claude-stream unittest suite — stdlib only, covers chrome
      # filtering, the answer-region fallback, terminal-state
      # taxonomy, and Client JSON-RPC framing. Runs on every host
      # so platform-specific path / encoding behaviour is caught.
      # Windows runners ship `python` (and `py`), not `python3`, so
      # the launcher differs per host.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Test (claude-stream unittest)
        shell: bash
        run: python -m unittest discover -t . -s tests/scripts -v
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" build --release --locked
      - name: Build
        if: runner.os != 'macOS'
        run: rustup run stable cargo build --release --locked

      # Lean baseline build (without the default `repl` feature). Keeps
      # the `--no-default-features` path green so projects that opt out of
      # the REPL stack — reedline, ratatui, crossbeam-channel,
      # nu-ansi-term — don't suddenly stop building. Windows is
      # check-only for v1.
      - name: Check (--no-default-features, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" check --locked --no-default-features
      - name: Check (--no-default-features)
        if: runner.os != 'macOS'
        run: rustup run stable cargo check --locked --no-default-features
      - name: Clippy (--no-default-features)
        if: runner.os != 'macOS'
        run: rustup run stable cargo clippy --locked --no-default-features -- -D warnings
      - name: Test (--no-default-features, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" test --locked --no-default-features --features _test-fixtures --lib --bins --tests
      - name: Test (--no-default-features)
        if: runner.os == 'ubuntu-latest'
        run: rustup run stable cargo test --locked --no-default-features --features _test-fixtures

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --features _test-fixtures --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
