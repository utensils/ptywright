name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build (e.g. v0.1.0). Required."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: ptywright-aarch64-apple-darwin.tar.gz
            archive: tar
          - os: macos-14
            target: x86_64-apple-darwin
            asset: ptywright-x86_64-apple-darwin.tar.gz
            archive: tar
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: ptywright-x86_64-unknown-linux-gnu.tar.gz
            archive: tar
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ptywright-aarch64-unknown-linux-gnu.tar.gz
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ptywright-x86_64-pc-windows-msvc.zip
            archive: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cross target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export RUSTC="$(rustup which rustc --toolchain stable)"
          CARGO_BIN="$(rustup which cargo --toolchain stable)"
          "$CARGO_BIN" build --release --target ${{ matrix.target }} --locked

      - name: Build
        if: runner.os != 'macOS'
        run: rustup run stable cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            strip target/${{ matrix.target }}/release/ptywright
          else
            strip --strip-all target/${{ matrix.target }}/release/ptywright
          fi

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/ptywright

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release ptywright

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/ptywright.exe -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum * > SHA256SUMS

      # Strip the `v` prefix so the release body can pin
      # `cargo install ptywright --version <bare>` to this exact release.
      # Without this, the rendered note would say "cargo install ptywright"
      # and silently track *whatever* version is latest on crates.io at the
      # time of install — confusing when reading an old release's notes.
      - name: Compute version (strip leading v)
        id: ver
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: |
            artifacts/ptywright-aarch64-apple-darwin.tar.gz
            artifacts/ptywright-x86_64-apple-darwin.tar.gz
            artifacts/ptywright-x86_64-unknown-linux-gnu.tar.gz
            artifacts/ptywright-aarch64-unknown-linux-gnu.tar.gz
            artifacts/ptywright-x86_64-pc-windows-msvc.zip
            artifacts/SHA256SUMS
          body: |
            ## Install

            ### One-liner (macOS + Linux)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/utensils/ptywright/main/install.sh | sh
            ```

            ### Manual download

            Grab the archive for your platform, verify the SHA256, and drop the binary on your `PATH`.

            | Platform | File |
            |----------|------|
            | macOS Apple Silicon | `ptywright-aarch64-apple-darwin.tar.gz` |
            | macOS Intel | `ptywright-x86_64-apple-darwin.tar.gz` |
            | Linux x86_64 | `ptywright-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux aarch64 | `ptywright-aarch64-unknown-linux-gnu.tar.gz` |
            | Windows x86_64 | `ptywright-x86_64-pc-windows-msvc.zip` |

            ```bash
            tar xzf ptywright-<target>.tar.gz
            ./ptywright --version
            ```

            On Windows, unzip the archive and run:

            ```powershell
            .\\ptywright.exe --version
            ```

            ### Cargo

            ```bash
            cargo install --git https://github.com/utensils/ptywright --tag ${{ github.event.inputs.tag || github.ref_name }}
            ```

            ### Cargo install (crates.io)

            ```bash
            cargo install ptywright --version ${{ steps.ver.outputs.version }} --locked
            ```

            ### Nix flake (macOS + Linux)

            ```bash
            nix run github:utensils/ptywright -- --help
            nix profile install github:utensils/ptywright
            ```

  # Publish to crates.io on v* tag pushes. Mirrors the pattern used by
  # ../mold: GH release first, crates.io second (immutable, so we only ever
  # publish on a real tag push — not workflow_dispatch rebuilds of
  # historical tags, which would clash with versions already on the index).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish ptywright
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
